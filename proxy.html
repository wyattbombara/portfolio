<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111211">
  <meta name="description" content="barebones web proxy — Wyatt">
  <title>proxy — Wyatt</title>
  <meta property="og:title" content="proxy — Wyatt">
  <meta property="og:description" content="barebones web proxy">
  <meta property="og:url" content="https://wyattbombara.github.io/portfolio/proxy.html">
  <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .proxy-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .proxy-bar input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      background: var(--tag-bg);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .proxy-bar input:focus {
      border-color: var(--hover-border);
    }
    .proxy-bar .btn {
      padding: 0.4rem 1rem;
    }
    #proxyFrame {
      width: 100%;
      height: 60vh;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      background: var(--card-bg);
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page">
    <nav aria-label="Main navigation">
      <a href="index.html" class="logo" aria-label="Wyatt, home"><span class="logo-mark" aria-hidden="true">w.</span><span>wyatt<span class="logo-caption">developer & tinkerer</span></span></a>
      <div class="nav-links"><a href="index.html#work">Work</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a><button id="termBtn" class="term-btn" aria-label="Open terminal">&gt;_</button><button class="theme-toggle" id="themeToggle" aria-label="Switch to light theme">light</button></div>
    </nav>

    <main id="main">
      <header class="subpage-heading"><p class="eyebrow">Wyatt / proxy</p><h1>Web proxy</h1><p>A small browser experiment.</p></header>
      <div class="card">
        <div style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.75rem;">proxy</div>
        <div class="proxy-bar">
          <input type="text" id="proxyUrl" aria-label="Website URL" placeholder="enter URL..." autocomplete="off" spellcheck="false">
          <button class="btn" id="proxyGo">go</button>
        </div>
        <iframe id="proxyFrame" title="Proxy browser" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
        <p class="page-description" style="margin-top: 16px; font-size: 11px;">An embedded browsing experiment. Some websites won’t work inside this viewer.</p>
      </div>
    </main>

    <footer class="site-footer"><span>© <span id="footerYear">2026</span> Wyatt Bombara</span><div><a href="index.html">Home</a><a href="settings.html">Settings</a></div><span class="local-clock"><span id="footerClock"></span> / your local time</span></footer>
  </div>

  <script>
    const input = document.getElementById('proxyUrl');
    const go = document.getElementById('proxyGo');
    const frame = document.getElementById('proxyFrame');

    function navigate() {
      let url = input.value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      frame.src = 'https://corsproxy.io/?' + encodeURIComponent(url);
    }

    go.addEventListener('click', navigate);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigate(); });
  </script>
  <script src="script.js"></script>
</body>
</html>
